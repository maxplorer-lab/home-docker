services:
  home:
    build: .
    container_name: home-sompitra
    restart: unless-stopped
    # The Worker gets this long to flush and close its SQLite files.
    stop_grace_period: 30s
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Live D1/DO state under state/; home.sqlite and sompitra.sqlite are
      # stable symlinks to it for people, backups and the Node tools.
      - ./data:/data
    environment:
      # REQUIRED for a seamless migration: the same pepper the Cloudflare
      # deployment used, or every imported password hash fails to verify.
      # Leave blank only for a fresh install claimed through /bootstrap.
      AUTH_PEPPER: "${AUTH_PEPPER:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Optional: push notifications still use the household ntfy server.
      NTFY_URL: "${NTFY_URL:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      PBKDF2_ITERATIONS: "5000"
      TZ: "${TZ:-Africa/Nairobi}"
