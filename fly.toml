# ─── Fly.io ──────────────────────────────────────────────────────
# One machine, one volume, no auto-stop. The reasons are in DOCKER.md:
#   * SQLite plus the in-process WebSocket hub is single-writer, so the app
#     must not scale to two machines;
#   * a suspended machine cold-starts on the first μlogger upload, and the
#     phone's HTTP timeout is short enough to lose that fix;
#   * /data is the only durable place — the container's own filesystem is
#     replaced on every deploy.
#
# The full Worker runtime (workerd + the Wrangler supervisor) needs 512 MB;
# the earlier 256 MB figure belonged to the stripped Node port, which is no
# longer what runs. That is ~$4.96/month in jnb against Fly's $5 allowance, so
# a 31-day month or a burst of traffic can cross it — which bills the whole
# month at standard rates instead of just the excess. Keep a billing alert on
# and check `fly machine status` after a deploy (DOCKER.md → Cost).
#
# Create the volume once, in the same region:
#   fly volumes create home_data --region jnb --size 1
# Set the secrets once:
#   fly secrets set AUTH_PEPPER=... SESSION_SECRET=...
# Then deploy ONE machine — flyctl creates two for a new app by default:
#   fly deploy --ha=false
#   fly machine list          # must print exactly one machine

app = "home-sompitra"
primary_region = "jnb"          # Johannesburg — closest to Madagascar

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TZ = "Africa/Nairobi"

[mounts]
  source = "home_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  # The Worker runtime (workerd) bundles and boots before /login answers.
  grace_period = "45s"
  method = "GET"
  path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB: workerd plus the Wrangler supervisor measured ~432 MB in
  # `docker stats` with the full super app loaded. 256 MB is not enough.
  memory = "512mb"
